name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential shellcheck
      - name: Record host tool versions
        run: |
          cc --version
          python3 --version
          bash --version
          shellcheck --version
      - name: Build clients and run host, native ABI, and shell checks
        run: make check

  kernel-module-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install a supported kernel header tree
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential kmod linux-headers-generic linux-image-generic qemu-system-x86 busybox-static cpio python3
      - name: Locate header tree
        id: headers
        shell: bash
        run: |
          kdir="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' -print | sort -V | tail -n 1)"
          test -n "${kdir}"
          echo "kdir=${kdir}" >> "${GITHUB_OUTPUT}"
      - name: Compile out-of-tree module
        run: make module KDIR="${{ steps.headers.outputs.kdir }}"
      - name: Confirm module metadata
        run: modinfo kernel/simple_char.ko
      - name: Boot disposable VM and exercise the loaded driver
        run: |
          version="$(make -s -C '${{ steps.headers.outputs.kdir }}' kernelrelease)"
          mkdir -p build
          sudo install -m 644 "/boot/vmlinuz-${version}" build/vmlinuz
          make check-vm KDIR="${{ steps.headers.outputs.kdir }}" KERNEL_IMAGE=build/vmlinuz
      - name: Retain VM console evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-console
          path: build/vm-console.log
          if-no-files-found: ignore
